version: 2
updates:
  - package-ecosystem: npm # also handles pnpm lockfiles
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # mirrors minimumReleaseAge in pnpm-workspace.yaml
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]
